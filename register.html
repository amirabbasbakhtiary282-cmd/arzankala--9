<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>ورود و ثبت نام | ارزان کالا</title>
    <meta name="description" content="فروشگاه اینترنتی ارزان‌کالا - خرید آنلاین انواع موبایل، لپ‌تاپ، تبلت و لوازم جانبی با بهترین قیمت">
    <meta name="keywords" content="ارزان کالا, فروشگاه اینترنتی, خرید آنلاین, موبایل, لپ تاپ, تبلت, لوازم جانبی">
    <meta name="robots" content="index, follow">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./img/logo.png">
    <link rel="stylesheet" href="./css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    
</head>
    
<body>
    
    <div id="site-header"></div>



    <div class="floating-orb"></div>
    <div class="floating-orb"></div>
    <div class="floating-orb"></div>
    <div class="auth-box page-main">
        <form id="registerForm">
            <h4 class="text-center">
                <i class="fa fa-user-plus text-success me-2"></i>
                ثبت نام
            </h4>
            
            <div class="mb-3">
                <label for="fullnamer">
                    <i class="fa fa-user me-1 text-success"></i> نام و نام خانوادگی
                </label>
                <input type="text" id="fullnamer" class="form-control" placeholder="مثال: علی محمدی">
            </div>
            
            <div class="mb-3">
                <label for="birth">
                    <i class="fa fa-calendar me-1 text-success"></i> سال تولد
                </label>
                <select id="birth" class="form-select"></select>
            </div>
            
            <div class="mb-3">
                <label for="mobiler">
                    <i class="fa fa-mobile-alt me-1 text-success"></i> شماره موبایل
                </label>
                <input type="text" id="mobiler" class="form-control" placeholder="09xxxxxxxxx">
            </div>
            
            <div class="mb-3">
                <label for="usernamer">
                    <i class="fa fa-at me-1 text-success"></i> نام کاربری
                </label>
                <input type="text" id="usernamer" class="form-control" placeholder="نام کاربری">
            </div>
            
            <div class="mb-3 position-relative">
                <label for="pass1">
                    <i class="fa fa-lock me-1 text-success"></i> کلمه عبور
                </label>
                <input type="password" id="pass1" class="form-control pe-5">
                <i class="fa fa-eye position-absolute" id="togglePass1"
                    style="top: 42px; left: 15px; cursor: pointer; font-size: 18px;"></i>
            </div>

            <div class="mb-3 position-relative">
                <label for="pass2">
                    <i class="fa fa-lock me-1 text-success"></i> تکرار کلمه عبور
                </label>
                <input type="password" id="pass2" class="form-control pe-5">
                <i class="fa fa-eye position-absolute" id="togglePass2"
                    style="top: 42px; left: 15px; cursor: pointer; font-size: 18px;"></i>
            </div>

            <button id="btnregister" class="btn btn-outline-warning w-100 py-2 mt-3">
                <i class="fa fa-user-plus me-2"></i>
                ثبت نام
            </button>
            
            <p class="mt-3 text-center">
                قبلاً ثبت نام کرده‌اید؟ 
                <span class="switch-link" id="toLogin">وارد شوید</span>
            </p>
        </form>

        <form id="loginForm" class="d-none">
            <h4 class="text-center">
                <i class="fa fa-sign-in-alt text-success me-2"></i>
                ورود
            </h4>

            <div class="mb-3">
                <label for="loginUser">
                    <i class="fa fa-user me-1 text-success"></i> نام کاربری
                </label>
                <input type="text" id="loginUser" class="form-control" placeholder="نام کاربری">
            </div>

            <div class="mb-3 position-relative">
                <label for="loginPass">
                    <i class="fa fa-lock me-1 text-success"></i> کلمه عبور
                </label>
                <input type="password" id="loginPass" class="form-control pe-5">
                <i class="fa fa-eye position-absolute" id="toggleLoginPass"
                    style="top: 42px; left: 15px; cursor: pointer; font-size: 18px;"></i>
            </div>

            <button id="btnlogin" class="btn btn-outline-warning w-100 py-2 mt-3">
                <i class="fa fa-sign-in-alt me-2"></i>
                ورود
            </button>

            <p class="mt-3 text-center">
                حساب کاربری ندارید؟ 
                <span class="switch-link" id="toRegister">ثبت نام کنید</span>
            </p>
        </form>
        
        <div class="text-center mt-4">
            <a href="./index.html" class="btn btn-outline-success btn-sm">
                <i class="fa fa-home me-1"></i>
                بازگشت به خانه
            </a>
        </div>
    </div>

    
    <div id="site-footer"></div>
    <script src="./js/layout.js" defer></script>
    <script src="./js/api.js" defer></script>
    <script src="./js/search.js" defer></script>
    <script src="./js/all.min.js" defer></script>
    <script src="./js/products-data.js" defer></script>
    <script src="./js/bootstrap.bundle.js" defer></script>
    <script src="./js/shop-cart.js" defer></script>
    <script src="./js/nav.js" defer></script>
    <script src="./js/compare.js" defer></script>
    <script src="./js/register.js" defer></script>
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./service-worker.js').catch(function(err) {
            console.log('ServiceWorker registration failed:', err);
        });
    }
    </script>
</body>
</html>
