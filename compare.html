<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مقایسه محصولات | ارزان کالا</title>
    <meta name="description" content="فروشگاه اینترنتی ارزان‌کالا - خرید آنلاین انواع موبایل، لپ‌تاپ، تبلت و لوازم جانبی با بهترین قیمت">
    <meta name="keywords" content="ارزان کالا, فروشگاه اینترنتی, خرید آنلاین, موبایل, لپ تاپ, تبلت, لوازم جانبی">
    <meta name="robots" content="index, follow">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./img/logo.png">
    
    <link rel="stylesheet" href="./css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">


</head>
<body>
    
    <div id="site-header"></div>



    <div class="floating-orb"></div>
    <div class="floating-orb"></div>
    <div class="floating-orb"></div>
    <div class="compare page-main">
        <div class="container">
        <div class="compare-box">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2 compare-header-actions">
                <h2 class="mb-0"><i class="fa fa-balance-scale text-success ms-2"></i> مقایسه محصولات</h2>
                <div class="d-flex align-items-center gap-2 flex-wrap">
                    <span class="compare-counter"><i class="fa fa-balance-scale me-1"></i> <span id="compareCount">0</span> محصول</span>
                    <button onclick="clearCompare()" class="btn-clear-all" id="clearAllBtn">
                        <i class="fa fa-trash"></i> حذف همه
                    </button>
                </div>
            </div>

            <!-- Filter bar -->
            <div class="compare-filter-bar mb-4 p-3 d-flex flex-wrap gap-3 align-items-center" style="display:none;" id="compareFilterBar">
                <div class="d-flex align-items-center gap-2 flex-wrap">
                    <label class="small mb-0">فیلتر:</label>
                    <select class="form-select form-select-sm" id="compareFilterCategory">
                        <option value="">همه دسته‌ها</option>
                    </select>
                    <select class="form-select form-select-sm" id="compareFilterBrand">
                        <option value="">همه برندها</option>
                    </select>
                    <input type="text" class="form-control form-control-sm" id="compareFilterSearch" placeholder="جستجو در محصولات مقایسه..." style="min-width:200px;flex:1;">
                </div>
                <div class="ms-auto d-flex gap-2 flex-wrap">
                    <button class="btn btn-outline-success btn-sm" onclick="resetCompareFilters()"><i class="fa fa-refresh me-1"></i> ریست فیلتر</button>
                    <a href="./category.html" class="btn btn-success btn-sm"><i class="fa fa-store me-1"></i> ادامه خرید</a>
                </div>
            </div>

            <div class="compare-table-wrapper" id="compareContent">
            </div>

            <div class="text-center mt-4">
                <a href="./category.html" class="btn btn-success btn-lg">
                    <i class="fa fa-store me-2"></i>
                    ادامه خرید
                </a>
            </div>
        </div>
    </div>
    </div>
     
    <div id="site-footer"></div>
<script src="./js/config.js?v=20260617" defer></script>
<script src="./js/layout.js?v=20260617" defer></script>

<script src="./js/search.js?v=20260617" defer></script>
<script src="./js/all.min.js?v=20260617" defer></script>
<script src="./js/products-data.js?v=20260617" defer></script>
<script src="./js/bootstrap.bundle.js?v=20260617" defer></script>
<script src="./js/shop-cart.js?v=20260617" defer></script>
<script src="./js/nav.js?v=20260617" defer></script>
<script src="./js/compare.js?v=20260617" defer></script>
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./service-worker.js').catch(function(err) {
            console.log('ServiceWorker registration failed:', err);
        });
    }
    </script>
