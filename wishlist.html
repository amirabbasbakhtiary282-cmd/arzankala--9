        <!-- Empty State -->
        <div id="wishlistEmptyState" class="text-center py-5" style="display:none;">

<script src="./js/config.js?v=20260617" defer></script>
<script src="./js/layout.js?v=20260617" defer></script>

<script src="./js/search.js?v=20260617" defer></script>
<script src="./js/all.min.js?v=20260617" defer></script>

<script src="./js/bootstrap.bundle.js?v=20260617" defer></script>

    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./service-worker.js').catch(function(err) {
            console.log('ServiceWorker registration failed:', err);
        });
    }
    </script>
    <script>
    (function () {
        document.addEventListener('DOMContentLoaded', async function () {
            const grid = document.getElementById('wishlistGrid');
            const emptyState = document.getElementById('wishlistEmptyState');
            const countBadge = document.getElementById('wishlistCount');

            function formatPrice(num) {
                if (!num && num !== 0) return '--';
                return num.toLocaleString('fa-IR');
            }

            function renderStars(rating) {
                const full = Math.floor(rating || 0);
                const half = (rating % 1) >= 0.5 ? 1 : 0;
                const empty = 5 - full - half;
                let html = '';
                for (let i = 0; i < full; i++) html += '<i class="fa fa-star text-warning"></i>';
                if (half) html += '<i class="fa fa-star-half-alt text-warning"></i>';
                for (let i = 0; i < empty; i++) html += '<i class="far fa-star text-muted"></i>';
                return html;
            }

            function computeDiscount(price, oldPrice) {
                if (!oldPrice || oldPrice <= price) return 0;
                return Math.round(((oldPrice - price) / oldPrice) * 100);
            }

            function createProductCard(product) {
                const discount = computeDiscount(product.price, product.oldPrice);
                const livePrice = product.priceUSD || product.priceUsd ? (product.priceUSD || product.priceUsd) : (product.price / 58000);
                return '<div class="col-sm-6 col-md-4 col-lg-3 wishlist-card-wrapper" data-id="' + product.id + '">' +
                    '<div class="glass-card product-card h-100 d-flex flex-column" style="transition:all 0.3s ease;overflow:hidden;position:relative;">' +
                        '<a href="product.html?id=' + product.id + '" class="text-decoration-none">' +
                            '<div class="product-card-img-wrapper" style="position:relative;overflow:hidden;border-radius:16px 16px 0 0;background:#1a1f1e;">' +
                                '<img src="' + (product.image || product.images?.[0] || './img/placeholder.png') + '" alt="' + (product.name || '') + '" class="w-100" style="height:200px;object-fit:cover;transition:transform 0.3s ease;" onerror="this.src=\'./img/placeholder.png\'">' +
                                (discount > 0 ? '<span class="badge bg-danger position-absolute" style="top:10px;left:10px;font-size:0.75rem;border-radius:10px;">%' + discount + '</span>' : '') +
                            '</div>' +
                        '</a>' +
                        '<div class="p-3 d-flex flex-column flex-grow-1">' +
                            '<a href="product.html?id=' + product.id + '" class="text-decoration-none">' +
                                '<h6 class="product-card-title fw-bold mb-2" style="color:var(--text-color);font-size:0.9rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em;line-height:1.4;">' + (product.name || 'محصول') + '</h6>' +
                            '</a>' +
                            '<div class="product-card-rating mb-2">' + renderStars(product.rating) +
                                (product.rating ? '<span class="text-muted small ms-1">' + product.rating + '</span>' : '') +
                            '</div>' +
                            '<div class="product-card-price mt-auto mb-2">' +
                                '<div class="d-flex align-items-baseline gap-2 flex-wrap">' +
                                    '<span class="product-price fw-bold text-success" style="font-size:1.05rem;"' + (livePrice ? ' data-live-price="' + livePrice + '"' : '') + '>' + formatPrice(product.price) + ' <small class="text-muted" style="font-size:0.65rem;">تومان</small></span>' +
                                    (product.oldPrice && product.oldPrice > product.price ? '<span class="text-muted text-decoration-line-through" style="font-size:0.8rem;">' + formatPrice(product.oldPrice) + '</span>' : '') +
                                '</div>' +
                            '</div>' +
                            '<div class="d-flex gap-2">' +
                                '<a href="product.html?id=' + product.id + '" class="btn btn-success btn-sm flex-grow-1" style="border-radius:10px;font-size:0.82rem;">' +
                                    '<i class="fa fa-eye ms-1"></i> مشاهده' +
                                '</a>' +
                                '<button class="btn btn-outline-danger btn-sm btn-remove-wishlist" data-id="' + product.id + '" title="حذف از علاقه‌مندی‌ها" style="border-radius:10px;font-size:0.82rem;">' +
                                    '<i class="fa fa-trash-alt"></i>' +
                                '</button>' +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            }

            async function loadWishlist() {
                let wishlistIds = [];
                let wishlistProducts = [];

                try {
                    const data = await API.getWishlist();
                    if (Array.isArray(data) && data.length > 0) {
                        if (typeof data[0] === 'object' && data[0].id) {
                            wishlistProducts = data;
                        } else {
                            wishlistIds = data;
                        }
                    }
                } catch (e) {
                    console.log('API wishlist failed, falling back to localStorage');
                }

                if (wishlistIds.length > 0) {
                    const fetched = await Promise.all(wishlistIds.map(async function (id) {
                        try {
                            const p = await API.getProductById(id);
                            return p || null;
                        } catch (e) { return null; }
                    }));
                    wishlistProducts = fetched.filter(Boolean);
                }

                if (wishlistProducts.length === 0) {
                    const localIds = JSON.parse(localStorage.getItem('wishlist') || '[]');
                    if (localIds.length > 0) {
                        const fetched = await Promise.all(localIds.map(async function (id) {
                            try {
                                const p = await API.getProductById(id);
                                return p || null;
                            } catch (e) { return null; }
                        }));
                        wishlistProducts = fetched.filter(Boolean);
                    }
                }

                countBadge.textContent = wishlistProducts.length;

                if (wishlistProducts.length === 0) {
                    grid.style.display = 'none';
                    emptyState.style.display = 'block';
                } else {
                    grid.style.display = '';
                    emptyState.style.display = 'none';
                    grid.innerHTML = wishlistProducts.map(createProductCard).join('');
                }

                grid.querySelectorAll('.btn-remove-wishlist').forEach(function (btn) {
                    btn.addEventListener('click', async function (e) {
                        e.preventDefault();
                        const id = this.getAttribute('data-id');
                        const card = this.closest('.wishlist-card-wrapper');
                        this.disabled = true;
                        this.innerHTML = '<i class="fa fa-spinner fa-spin"></i>';
                        try {
                            await API.removeFromWishlist(id);
                        } catch (e) {}
                        let localWish = JSON.parse(localStorage.getItem('wishlist') || '[]');
                        localWish = localWish.filter(function (x) { return String(x) !== String(id); });
                        localStorage.setItem('wishlist', JSON.stringify(localWish));
                        if (card) {
                            card.style.transition = 'all 0.4s ease';
                            card.style.opacity = '0';
                            card.style.transform = 'scale(0.8)';
                            setTimeout(function () {
                                card.remove();
                                const remaining = grid.querySelectorAll('.wishlist-card-wrapper');
                                countBadge.textContent = remaining.length;
                                if (remaining.length === 0) {
                                    grid.style.display = 'none';
                                    emptyState.style.display = 'block';
                                }
                            }, 400);
                        }
                        API.showNotification('محصول از علاقه‌مندی‌ها حذف شد', 'success');
                    });
                });
            }

            loadWishlist();
        });
    })();
    </script>

    <div id="site-footer"></div>

</body>
