<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشخصات خرید شما | ارزان کالا</title>
    <meta name="description" content="فروشگاه اینترنتی ارزان‌کالا - خرید آنلاین انواع موبایل، لپ‌تاپ، تبلت و لوازم جانبی با بهترین قیمت">
    <meta name="keywords" content="ارزان کالا, فروشگاه اینترنتی, خرید آنلاین, موبایل, لپ تاپ, تبلت, لوازم جانبی">
    <meta name="robots" content="index, follow">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./img/logo.png">
    <link rel="stylesheet" href="./css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
    
</head>
<body>
    <div id="site-header"></div>



    <div class="floating-orb"></div>
    <div class="floating-orb"></div>
    <div class="floating-orb"></div>
    <div class="profile-box page-main" style="text-align:center;padding:40px 35px">
        <div style="font-size:3rem;margin-bottom:12px;background:linear-gradient(135deg,#00c853,#00e676,#69f0ae);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px rgba(0,200,83,0.3));animation:pulse 2s ease-in-out infinite">🤖</div>
        <h3 class="mb-2 fw-bold" style="font-size:1.6rem;background:linear-gradient(135deg,#fff 0%,#00c853 50%,#69f0ae 100%);-webkit-background-clip:text;background-clip:text;color:transparent">شخصیت خرید خود را بسازید</h3>
        <p style="color:var(--text-muted);font-size:0.9rem;margin-bottom:24px">با مشخص کردن نیازهایتان، پیشنهاد هوشمند ما را دریافت کنید</p>
        <form id="profileForm" style="text-align:right">
            <div class="mb-3">
                <label><i class="fa fa-gamepad ms-1" style="color:var(--green-primary)"></i> نوع استفاده</label>
                <select class="form-control" id="usage" required>
                    <option value="">انتخاب کنید</option>
                    <option value="gaming">🎮 گیمینگ</option>
                    <option value="student">📚 دانشجو</option>
                    <option value="office">💼 اداری</option>
                    <option value="normal">🧑 معمولی</option>
                </select>
            </div>
            <div class="mb-3">
                <label><i class="fa fa-wallet ms-1" style="color:var(--green-primary)"></i> بودجه</label>
                <select class="form-control" id="budget" required>
                    <option value="">انتخاب کنید</option>
                    <option value="low">💰 اقتصادی</option>
                    <option value="medium">💵 متوسط</option>
                    <option value="high">💎 حرفه‌ای</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="mb-2" style="display:block"><i class="fa fa-clock ms-1" style="color:var(--green-primary)"></i> فوریت</label>
                <div class="d-flex gap-2 flex-wrap justify-content-center">
                    <label class="btn btn-outline-warning px-4 urgency-btn" style="border-radius:30px;cursor:pointer">
                        <input type="radio" name="urgency" value="urgent" required class="d-none"> 🔥 فوری
                    </label>
                    <label class="btn btn-outline-info px-4 urgency-btn" style="border-radius:30px;cursor:pointer">
                        <input type="radio" name="urgency" value="normal" class="d-none"> ⏳ معمولی
                    </label>
                    <label class="btn btn-outline-secondary px-4 urgency-btn" style="border-radius:30px;cursor:pointer">
                        <input type="radio" name="urgency" value="patient" class="d-none"> 🧘 عجله ندارم
                    </label>
                </div>
            </div>
            <button type="submit" class="btn btn-success w-100 py-3" style="border-radius:16px;font-weight:700;font-size:1.05rem;transition:all 0.3s ease">
                <i class="fa fa-robot ms-2"></i> دریافت پیشنهاد هوشمند
            </button>
        </form>
        <div class="text-center mt-4">
            <a href="./category.html" class="btn btn-outline-secondary btn-sm px-4" style="border-radius:30px;border-color:rgba(255,255,255,0.15);color:var(--text-muted)">
                <i class="fa fa-store ms-1"></i> مشاهده همه محصولات
            </a>
        </div>
    </div>
    <div id="site-footer"></div>
<script src="./js/config.js?v=20260617" defer></script>
<script src="./js/layout.js?v=20260617" defer></script>
<script src="./js/api.js?v=20260617" defer></script>
<script src="./js/search.js?v=20260617" defer></script>
<script src="./js/all.min.js?v=20260617" defer></script>
<script src="./js/products-data.js?v=20260617" defer></script>
<script src="./js/bootstrap.bundle.js?v=20260617" defer></script>
<script src="./js/shop-cart.js?v=20260617" defer></script>
<script src="./js/nav.js?v=20260617" defer></script>
<script src="./js/compare.js?v=20260617" defer></script>
    <script>
        document.getElementById('profileForm').onsubmit = function(e) {
            e.preventDefault();
            let usage = document.getElementById('usage').value || 'normal';
            let budget = document.getElementById('budget').value || 'medium';
            let urgencyEl = document.querySelector('[name=urgency]:checked');
            let urgency = urgencyEl ? urgencyEl.value : 'normal';
            if (usage === '') usage = 'normal';
            if (budget === '') budget = 'medium';
            localStorage.setItem('profile', JSON.stringify({
                usage: usage,
                budget: budget,
                urgency: urgency
            }));
            window.location.href = 'advisor.html';
        };
    </script>
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./service-worker.js').catch(function(err) {
            console.log('ServiceWorker registration failed:', err);
        });
    }
    </script>
</body>
</html>
