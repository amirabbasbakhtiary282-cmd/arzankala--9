<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پیشنهاد هوشمند | ارزان کالا</title>
    <meta name="description" content="فروشگاه اینترنتی ارزان‌کالا - خرید آنلاین انواع موبایل، لپ‌تاپ، تبلت و لوازم جانبی با بهترین قیمت">
    <meta name="keywords" content="ارزان کالا, فروشگاه اینترنتی, خرید آنلاین, موبایل, لپ تاپ, تبلت, لوازم جانبی">
    <meta name="robots" content="index, follow">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./img/logo.png">

    <link rel="stylesheet" href="./css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap');

        :root {
            --glass-bg: rgba(17, 20, 19, 0.7);
            --glass-border: rgba(0, 200, 83, 0.15);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --neon-glow: 0 0 20px rgba(0, 200, 83, 0.15);
            --card-radius: 24px;
            --transition-smooth: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .advisor-box {
            background: var(--glass-bg) !important;
            backdrop-filter: blur(20px) !important;
            -webkit-backdrop-filter: blur(20px) !important;
            border: 1px solid var(--glass-border) !important;
            border-radius: 32px !important;
            box-shadow: var(--glass-shadow), var(--neon-glow) !important;
            padding: 2.5rem !important;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        .advisor-header-icon {
            font-size: 3.5rem;
            background: linear-gradient(135deg, #00c853, #00e676, #69f0ae);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 20px rgba(0, 200, 83, 0.3));
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .advisor-title {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 0%, #00c853 50%, #69f0ae 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 2.2rem;
            letter-spacing: -0.5px;
        }

        .profile-badge .badge {
            transition: var(--transition-smooth);
            cursor: default;
        }
        .profile-badge .badge:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 200, 83, 0.2);
        }

        .product-card-modern {
            background: linear-gradient(145deg, rgba(17, 20, 19, 0.9), rgba(26, 30, 29, 0.8));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--card-radius);
            overflow: hidden;
            transition: var(--transition-smooth);
            position: relative;
            animation: cardFadeIn 0.5s ease-out both;
        }

        .product-card-modern:nth-child(1) { animation-delay: 0.05s; }
        .product-card-modern:nth-child(2) { animation-delay: 0.1s; }
        .product-card-modern:nth-child(3) { animation-delay: 0.15s; }
        .product-card-modern:nth-child(4) { animation-delay: 0.2s; }
        .product-card-modern:nth-child(5) { animation-delay: 0.25s; }
        .product-card-modern:nth-child(6) { animation-delay: 0.3s; }
        .product-card-modern:nth-child(7) { animation-delay: 0.35s; }
        .product-card-modern:nth-child(8) { animation-delay: 0.4s; }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .product-card-modern:hover {
            transform: translateY(-6px);
            border-color: rgba(0, 200, 83, 0.3);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3), 0 0 30px rgba(0, 200, 83, 0.08);
        }

        .product-card-modern .card-glow {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 0%, rgba(0, 200, 83, 0.03), transparent 60%);
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }

        .product-card-modern:hover .card-glow {
            opacity: 1;
        }

        .product-card-modern .product-img-wrap {
            padding: 20px 20px 10px;
            position: relative;
            overflow: hidden;
        }

        .product-card-modern .product-img-wrap img {
            height: 160px;
            width: 100%;
            object-fit: contain;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .product-card-modern:hover .product-img-wrap img {
            transform: scale(1.08);
        }

        .product-card-modern .rank-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 3;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            animation: badgePop 0.4s ease-out both;
        }

        .product-card-modern .rank-badge:nth-child(1) { animation-delay: 0.3s; }

        @keyframes badgePop {
            from { transform: scale(0); }
            50% { transform: scale(1.15); }
            to { transform: scale(1); }
        }

        .product-card-modern .product-info {
            padding: 12px 18px 18px;
            position: relative;
        }

        .product-card-modern .product-title {
            font-weight: 700;
            color: #fff;
            font-size: 0.9rem;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }

        .product-card-modern .price-tag {
            font-weight: 800;
            font-size: 1.05rem;
            color: #00c853;
            direction: ltr;
            display: inline-block;
        }

        .product-card-modern .old-price-tag {
            color: rgba(255, 255, 255, 0.35);
            text-decoration: line-through;
            font-size: 0.75rem;
        }

        .product-card-modern .score-bar-wrap {
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            overflow: hidden;
            margin: 8px 0;
        }

        .product-card-modern .score-bar {
            height: 100%;
            border-radius: 4px;
            transition: width 1s ease-out;
            width: 0;
        }

        .product-card-modern .score-bar.animate {
            width: var(--score-width);
        }

        .product-card-modern .reason-tag {
            display: inline-block;
            background: rgba(0, 200, 83, 0.1);
            border: 1px solid rgba(0, 200, 83, 0.2);
            color: #00c853;
            font-size: 0.6rem;
            padding: 2px 10px;
            border-radius: 20px;
            margin: 2px 3px 2px 0;
            transition: var(--transition-smooth);
        }

        .product-card-modern .reason-tag:hover {
            background: rgba(0, 200, 83, 0.2);
            border-color: #00c853;
        }

        .product-card-modern .btn-modern {
            border-radius: 30px;
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            transition: var(--transition-smooth);
            border: none;
        }

        .product-card-modern .btn-add-cart {
            background: linear-gradient(135deg, #00c853, #009624);
            color: white;
            flex: 1;
        }

        .product-card-modern .btn-add-cart:hover {
            transform: scale(1.03);
            box-shadow: 0 5px 20px rgba(0, 200, 83, 0.3);
        }

        .product-card-modern .btn-add-cart:disabled {
            background: #333;
            cursor: not-allowed;
        }

        .product-card-modern .btn-view {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            width: 36px;
            padding: 6px 0;
        }

        .product-card-modern .btn-view:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .product-card-modern .stock-indicator {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.65rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .product-card-modern .stock-indicator i {
            font-size: 0.5rem;
        }

        .product-card-modern .discount-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 3;
            background: linear-gradient(135deg, #ff1744, #d50000);
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(255, 23, 68, 0.3);
            animation: badgePop 0.4s 0.2s ease-out both;
        }

        .product-card-modern .stock-low {
            position: absolute;
            bottom: 10px;
            right: 10px;
            z-index: 3;
            background: rgba(255, 193, 7, 0.15);
            border: 1px solid rgba(255, 193, 7, 0.3);
            color: #ffc107;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.6rem;
        }

        .ai-box-modern {
            background: linear-gradient(135deg, rgba(0, 200, 83, 0.05), rgba(0, 200, 83, 0.02));
            border: 1px solid rgba(0, 200, 83, 0.15);
            border-radius: 20px;
            padding: 20px;
            transition: var(--transition-smooth);
        }

        .ai-box-modern:hover {
            border-color: rgba(0, 200, 83, 0.3);
            box-shadow: 0 0 30px rgba(0, 200, 83, 0.05);
        }

        .btn-glow {
            position: relative;
            overflow: hidden;
            transition: var(--transition-smooth);
        }

        .btn-glow::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #00c853, #009624, #00e676, #00c853);
            background-size: 400% 400%;
            border-radius: 30px;
            z-index: -1;
            animation: shimmer 3s linear infinite;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .btn-glow:hover::before {
            opacity: 1;
        }

        .btn-glow:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 200, 83, 0.3);
        }

        .loading-modern {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 60px 20px;
        }

        .loading-modern .loader-ring {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(0, 200, 83, 0.1);
            border-top-color: #00c853;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-modern .loader-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
        }

        .loading-modern .loader-dots span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #00c853;
            border-radius: 50%;
            margin: 0 3px;
            animation: dotBounce 1.4s ease-in-out infinite both;
        }

        .loading-modern .loader-dots span:nth-child(1) { animation-delay: 0s; }
        .loading-modern .loader-dots span:nth-child(2) { animation-delay: 0.16s; }
        .loading-modern .loader-dots span:nth-child(3) { animation-delay: 0.32s; }

        @keyframes dotBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .installment-modern {
            background: linear-gradient(145deg, rgba(17, 20, 19, 0.9), rgba(26, 30, 29, 0.8));
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 200, 83, 0.1);
            border-radius: 24px !important;
            padding: 28px !important;
            transition: var(--transition-smooth);
        }

        .installment-modern:hover {
            border-color: rgba(0, 200, 83, 0.2);
        }

        .installment-modern .form-control,
        .installment-modern .form-select {
            background: rgba(10, 12, 11, 0.8) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            color: white !important;
            border-radius: 16px !important;
            padding: 12px 16px !important;
            transition: var(--transition-smooth);
        }

        .installment-modern .form-control:focus,
        .installment-modern .form-select:focus {
            border-color: #00c853 !important;
            box-shadow: 0 0 20px rgba(0, 200, 83, 0.1) !important;
        }

        @media (max-width: 768px) {
            .advisor-box { padding: 1.5rem !important; border-radius: 24px !important; }
            .advisor-title { font-size: 1.5rem; }
            .product-card-modern .product-img-wrap img { height: 120px; }
            .product-card-modern .product-info { padding: 8px 12px 12px; }
            .product-card-modern .price-tag { font-size: 0.9rem; }
            .product-card-modern .product-title { font-size: 0.8rem; }
        }

        @media (max-width: 576px) {
            .advisor-box { padding: 1rem !important; }
            .product-card-modern .product-img-wrap img { height: 100px; }
            .product-card-modern .product-img-wrap { padding: 12px 12px 6px; }
        }

        .floating-orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.15;
        }

        .floating-orb:nth-child(1) {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #00c853, transparent);
            top: 10%;
            left: -5%;
            animation: orbFloat 15s ease-in-out infinite;
        }

        .floating-orb:nth-child(2) {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #00e676, transparent);
            bottom: 20%;
            right: -3%;
            animation: orbFloat 20s ease-in-out infinite reverse;
        }

        .floating-orb:nth-child(3) {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, #69f0ae, transparent);
            top: 50%;
            left: 50%;
            animation: orbFloat 18s ease-in-out infinite 5s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }
    </style>
</head>

<body>

    <div id="site-header"></div>



    <div class="floating-orb"></div>
    <div class="floating-orb"></div>
    <div class="floating-orb"></div>

    <div class="container page-main">
        <div class="advisor-box">
            <div class="text-center mb-4">
                <i class="fa fa-robot advisor-header-icon mb-3"></i>
                <h2 class="advisor-title mb-2">پیشنهاد هوشمند ارزان کالا</h2>
                <p class="text-white-50" style="font-size: 0.95rem; opacity: 0.7;">این محصولات بر اساس نیازهای شما با هوش مصنوعی انتخاب شده‌اند</p>
            </div>

            <div id="profileDisplay" class="profile-badge text-center mb-4"></div>

            <div id="recommendedProducts" class="row g-3 g-md-4 mb-4">
                <div class="col-12">
                    <div class="loading-modern">
                        <div class="loader-ring"></div>
                        <div class="loader-text">هوش مصنوعی در حال تحلیل سبد خرید ایده‌آل برای شماست</div>
                        <div class="loader-dots"><span></span><span></span><span></span></div>
                    </div>
                </div>
            </div>

            <div id="buyTimeStatus" class="time-badge"></div>

            <div class="row g-3">
                <div class="col-12 col-md-8">
                    <button id="addAllToCart" class="btn btn-glow w-100 py-3" style="background: linear-gradient(135deg, #00c853, #009624); color: white; border: none; border-radius: 30px; font-weight: 700; font-size: 1rem;">
                        <i class="fa fa-cart-plus me-2"></i>
                        افزودن همه محصولات به سبد خرید
                    </button>
                </div>
                <div class="col-12 col-md-4">
                    <a href="choose.html" class="btn btn-outline-success w-100 py-3" style="border-radius: 30px; border-width: 2px; font-weight: 600;">
                        <i class="fa fa-edit me-2"></i>
                        ویرایش مشخصات
                    </a>
                </div>
            </div>

            <div class="text-center mt-4">
                <a href="category.html" class="btn btn-outline-secondary px-4 py-2" style="border-radius: 30px; border-color: rgba(255,255,255,0.15); color: rgba(255,255,255,0.5);">
                    <i class="fa fa-store me-1 store-icon"></i>
                    مشاهده همه محصولات فروشگاه
                </a>
            </div>
        </div>
    </div>

    <div id="site-footer"></div>

<script src="./js/layout.js?v=20260617" defer></script>

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./service-worker.js').catch(function(err) {
            console.log('ServiceWorker registration failed:', err);
        });
    }
    </script>
</body>
